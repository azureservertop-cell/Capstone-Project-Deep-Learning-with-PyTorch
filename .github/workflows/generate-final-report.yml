name: Generate Final Report PDF

on:
  push:
    paths:
      - 'scripts/generate_final_report.py'
      - '.github/workflows/generate-final-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: pip install reportlab matplotlib numpy

      - name: Generate final PDF
        run: python scripts/generate_final_report.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/EuroSAT_Final_Report.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Add final EuroSAT capstone report PDF"
            git push
          fi
